name = "sahara-website"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".vercel/output/static"

# ─────────────────────────────────────────────
# D1 DATABASE
# ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "sahara-printer-db"
database_id = "2c278d16-64fe-42a6-8ea1-aabdf75c2ce9"

# ─────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# Replace the placeholder values below with your real Cloudinary credentials.
# Get them from: https://console.cloudinary.com → Settings → API Keys
# For production (Cloudflare Pages), set these in:
#   Cloudflare Dashboard → Pages → sahara-website → Settings → Environment variables
# ─────────────────────────────────────────────
# ─────────────────────────────────────────────
# LOCAL DEV ONLY (wrangler pages dev)
# For production, set these in:
#   Cloudflare Dashboard → Pages → sahara-website → Settings → Environment variables
# Get credentials from: https://console.cloudinary.com → Settings → API Keys
# ─────────────────────────────────────────────
[vars]

CLOUDINARY_CLOUD_NAME = "REMOVED_CLOUD_NAME"
CLOUDINARY_API_KEY    = "REMOVED_API_KEY"
CLOUDINARY_API_SECRET = "REMOVED_API_SECRET"
