name = "sahara-website"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "sahara-printer-db"
database_id = "2c278d16-64fe-42a6-8ea1-aabdf75c2ce9"

# R2 bucket for file storage
[[r2_buckets]]
binding = "SAHARA_ASSETS"
bucket_name = "sahara-printer-files"

[vars]
CLOUDFLARE_ACCOUNT_ID = "SET_IN_CLOUDFLARE_DASHBOARD"
# Set R2_PUBLIC_URL after enabling Public Access on your R2 bucket in Cloudflare Dashboard
# It will look like: https://pub-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX.r2.dev
R2_PUBLIC_URL = ""
