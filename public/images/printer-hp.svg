<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#dce3ed"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#5c6b84"/>
      <stop offset="100%" stop-color="#2c3a50"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e7f99"/>
      <stop offset="100%" stop-color="#4a5870"/>
    </linearGradient>
    <linearGradient id="feeder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8090aa"/>
      <stop offset="100%" stop-color="#5c6b84"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0096d6"/>
      <stop offset="100%" stop-color="#006fa4"/>
    </linearGradient>
    <linearGradient id="tray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7080a0"/>
      <stop offset="100%" stop-color="#4a5870"/>
    </linearGradient>
    <filter id="dropshadow" x="-10%" y="-10%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="14" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>
    <filter id="softshadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1a2535" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)"/>

  <!-- Floor reflection -->
  <ellipse cx="400" cy="510" rx="260" ry="18" fill="#b0bccf" opacity="0.35"/>

  <g filter="url(#softshadow)">

    <!-- === PAPER TRAY (bottom) === -->
    <rect x="130" y="440" width="540" height="56" rx="6" fill="url(#tray)"/>
    <rect x="135" y="436" width="530" height="14" rx="3" fill="#8090aa"/>
    <!-- Tray handle indent -->
    <rect x="310" y="452" width="180" height="8" rx="4" fill="#3a4a60" opacity="0.5"/>
    <!-- Tray edge detail -->
    <rect x="130" y="440" width="540" height="3" rx="0" fill="#96a6be" opacity="0.5"/>

    <!-- === MAIN BODY === -->
    <rect x="110" y="200" width="580" height="245" rx="8" fill="url(#body)"/>

    <!-- Body left accent stripe -->
    <rect x="110" y="200" width="10" height="245" rx="4" fill="#7888a4" opacity="0.6"/>

    <!-- Output slot / paper exit -->
    <rect x="120" y="330" width="475" height="28" rx="3" fill="#1c2a3d"/>
    <rect x="125" y="334" width="465" height="20" rx="2" fill="#0f1a28"/>
    <!-- Exit slot highlight -->
    <rect x="125" y="334" width="465" height="2" fill="#3a5070" opacity="0.6"/>

    <!-- Front lower panel -->
    <rect x="120" y="365" width="430" height="68" rx="4" fill="#3a4a60"/>
    <rect x="125" y="369" width="420" height="60" rx="3" fill="#2e3c52"/>

    <!-- Front panel HP logo zone -->
    <rect x="135" y="378" width="90" height="40" rx="4" fill="#1a2535"/>
    <text x="180" y="405" font-family="Arial Black,Arial,sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">HP</text>

    <!-- Model number -->
    <text x="248" y="392" font-family="Arial,sans-serif" font-size="9" fill="#7a8aaa">LaserJet Enterprise</text>
    <text x="248" y="404" font-family="Arial,sans-serif" font-size="9" fill="#5a6a88">M608 Series</text>

    <!-- Status LED -->
    <circle cx="558" cy="382" r="6" fill="#00c866"/>
    <circle cx="558" cy="382" r="3" fill="#66ffbb" opacity="0.8"/>

    <!-- Connectivity ports -->
    <rect x="568" y="376" width="6" height="10" rx="1" fill="#0f1a28"/>
    <rect x="578" y="376" width="6" height="10" rx="1" fill="#0f1a28"/>

    <!-- Front vents -->
    <rect x="135" y="424" width="3" height="5" rx="1" fill="#0f1a28" opacity="0.7"/>
    <rect x="141" y="424" width="3" height="5" rx="1" fill="#0f1a28" opacity="0.7"/>
    <rect x="147" y="424" width="3" height="5" rx="1" fill="#0f1a28" opacity="0.7"/>

    <!-- === TOP SECTION === -->
    <rect x="110" y="148" width="580" height="58" rx="8" fill="url(#top)"/>
    <!-- Top edge highlight -->
    <rect x="110" y="148" width="580" height="4" rx="4" fill="#9aaac0" opacity="0.5"/>
    <!-- Top output tray surface -->
    <rect x="115" y="196" width="570" height="8" rx="2" fill="#3a4a60"/>

    <!-- === CONTROL PANEL (HP blue) === -->
    <rect x="470" y="158" width="200" height="44" rx="6" fill="url(#panel)"/>
    <!-- Panel gloss -->
    <rect x="472" y="159" width="196" height="8" rx="4" fill="white" opacity="0.12"/>

    <!-- Touchscreen display -->
    <rect x="478" y="164" width="120" height="30" rx="4" fill="#001824"/>
    <rect x="480" y="166" width="116" height="26" rx="3" fill="#00253a"/>
    <!-- Screen content lines -->
    <rect x="485" y="171" width="70" height="3" rx="1" fill="#0096d6" opacity="0.9"/>
    <rect x="485" y="178" width="50" height="3" rx="1" fill="#0096d6" opacity="0.6"/>
    <rect x="485" y="185" width="60" height="3" rx="1" fill="#0096d6" opacity="0.4"/>

    <!-- Control buttons row -->
    <circle cx="616" cy="173" r="7" fill="#004f7a"/>
    <circle cx="616" cy="173" r="4" fill="#0078b0"/>
    <circle cx="634" cy="173" r="5" fill="#004060"/>
    <circle cx="634" cy="173" r="2.5" fill="#005f8a"/>
    <rect x="608" y="183" width="34" height="10" rx="3" fill="#004060"/>
    <rect x="611" y="186" width="28" height="4" rx="1" fill="#0078b0" opacity="0.6"/>

    <!-- Right-side vents on top section -->
    <rect x="668" y="162" width="16" height="2" rx="1" fill="#2a3848" opacity="0.8"/>
    <rect x="668" y="168" width="16" height="2" rx="1" fill="#2a3848" opacity="0.8"/>
    <rect x="668" y="174" width="16" height="2" rx="1" fill="#2a3848" opacity="0.8"/>
    <rect x="668" y="180" width="16" height="2" rx="1" fill="#2a3848" opacity="0.8"/>

    <!-- === DOCUMENT FEEDER (top) === -->
    <rect x="110" y="96" width="420" height="56" rx="7" fill="url(#feeder)"/>
    <!-- Feeder lid -->
    <rect x="115" y="100" width="410" height="46" rx="5" fill="#7282a0"/>
    <!-- Feeder glass line -->
    <rect x="120" y="108" width="400" height="30" rx="3" fill="#8294b2" opacity="0.7"/>
    <rect x="122" y="110" width="396" height="2" fill="#a0b2cc" opacity="0.6"/>
    <!-- Feeder paper guide -->
    <rect x="135" y="96" width="8" height="56" rx="3" fill="#5a6a84"/>
    <rect x="375" y="96" width="8" height="56" rx="3" fill="#5a6a84"/>

    <!-- Feeder hinge connector to body -->
    <rect x="108" y="148" width="424" height="6" rx="2" fill="#3a4a60"/>

    <!-- Right side panel detail -->
    <rect x="682" y="210" width="6" height="225" rx="3" fill="#3a4a60" opacity="0.5"/>

    <!-- Vent grilles right side of body -->
    <rect x="662" y="225" width="25" height="2" rx="1" fill="#1c2a3d" opacity="0.7"/>
    <rect x="662" y="232" width="25" height="2" rx="1" fill="#1c2a3d" opacity="0.7"/>
    <rect x="662" y="239" width="25" height="2" rx="1" fill="#1c2a3d" opacity="0.7"/>
    <rect x="662" y="246" width="25" height="2" rx="1" fill="#1c2a3d" opacity="0.7"/>
    <rect x="662" y="253" width="25" height="2" rx="1" fill="#1c2a3d" opacity="0.7"/>
    <rect x="662" y="260" width="25" height="2" rx="1" fill="#1c2a3d" opacity="0.7"/>

  </g>

  <!-- HP wordmark below printer -->
  <text x="400" y="540" font-family="Arial Black,Arial,sans-serif" font-size="13" font-weight="900" fill="#0078b0" text-anchor="middle" letter-spacing="3">HP LaserJet Enterprise</text>
</svg>
