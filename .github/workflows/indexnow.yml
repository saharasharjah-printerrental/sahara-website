name: IndexNow submission

# Originally fired on the GitHub Deployment status Cloudflare Pages' GitHub
# integration posts for each build — but this repo's Cloudflare Pages
# project never actually posts deployment_status events (confirmed via
# `gh api repos/.../deployments` returning zero entries, and zero
# check-runs on HEAD besides this workflow's own), so that trigger never
# fired since the automation was built. Switched to `push` on main with a
# fixed delay to let the Cloudflare build/deploy finish first — Next.js
# builds on this project take well under 3 minutes. See
# scripts/seo/indexnow.mjs for what gets submitted and why.
on:
  push:
    branches: [main]
  # Also dispatched by src/app/api/admin/indexnow/route.ts (the admin SEO
  # page's IndexNow section) instead of calling api.indexnow.org directly —
  # Cloudflare Pages Functions share outbound IPs across every Cloudflare
  # tenant, and IndexNow rate-limits by source IP, so calls made straight
  # from the edge kept failing with "TooManyRequests" caused by *other*
  # customers' traffic, not ours. Runs dispatched here go out from GitHub's
  # own runner IPs instead, which don't have that problem.
  workflow_dispatch:
    inputs:
      urls:
        description: 'Specific URL(s) to submit, comma-separated. Leave empty to submit the sitemap.'
        required: false
        type: string
      force:
        description: 'Resubmit every sitemap URL, ignoring the dedupe state (used by the "Submit All Sitemap URLs" admin button)'
        required: false
        type: boolean
        default: false

jobs:
  submit:
    name: Submit changed URLs to IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Give Cloudflare Pages time to finish building and deploying before
      # fetching the sitemap, so we don't submit against stale content.
      - name: Wait for Cloudflare Pages deploy
        if: github.event_name == 'push'
        run: sleep 180

      # GitHub Actions runners are ephemeral — without this, indexnow.mjs's
      # dedupe state would reset every run and resubmit all ~140 sitemap URLs
      # on every deploy. Restoring/saving it here lets the script actually
      # skip unchanged URLs between deploys, same as a local repeat run.
      - name: Restore IndexNow submission state
        uses: actions/cache@v4
        with:
          path: scripts/seo/indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      - name: Submit to IndexNow
        env:
          URLS_INPUT: ${{ github.event.inputs.urls }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          ARGS="--site https://www.saharaprinter.com"
          if [ "$FORCE_INPUT" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "$URLS_INPUT" ]; then
            IFS=',' read -ra URL_ARR <<< "$URLS_INPUT"
            for u in "${URL_ARR[@]}"; do
              trimmed="$(echo "$u" | xargs)"
              if [ -n "$trimmed" ]; then ARGS="$ARGS $trimmed"; fi
            done
          fi
          node scripts/seo/indexnow.mjs $ARGS
